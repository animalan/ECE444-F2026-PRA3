{% extends "base.html" %}

{% block title %}Flasky - Chat{% endblock %}

{% block page_content %}
<div class="page-header">
    <h1>Chatbot</h1>
    <a href="{{ url_for('logout') }}" class="btn btn-danger">Logout</a>
</div>

<div class="row">
    <div class="col-md-8">
        <div id="chat-box" style="height: 300px; overflow-y: scroll; border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; background: #fafafa; border-radius: 4px;">
            <p><strong>Bot:</strong> Hello! How can I help you?</p>
        </div>

        <form id="chat-form" onsubmit="sendMessage(event)">
            <div class="input-group">
                <input type="text" id="message-input" class="form-control" placeholder="Type a message (e.g., 'My name is Alice' or 'What is my name?')" required autocomplete="off">
                <span class="input-group-btn">
                    <button class="btn btn-primary" type="submit">Send</button>
                </span>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
    async function sendMessage(event) {
        event.preventDefault();
        const input = document.getElementById('message-input');
        const message = input.value.trim();
        if (!message) return;

        const chatBox = document.getElementById('chat-box');

        // Display User message (their question)
        const userMsg = document.createElement('p');
        userMsg.innerHTML = '<strong>User:</strong> ' + message;
        chatBox.appendChild(userMsg);

        input.value = '';

        // Send POST request to /chat
        const response = await fetch("{{ url_for('chat') }}", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: message })
        });

        const data = await response.json();

        // Display Bot reply
        const botMsg = document.createElement('p');
        botMsg.innerHTML = '<strong>Bot:</strong> ' + data.reply;
        chatBox.appendChild(botMsg);

        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>
{% endblock %}
